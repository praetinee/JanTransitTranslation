<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกดวงดาว - การโคจรและผลกระทบ (Custom Chart)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f7f5f0;
            color: #333333;
        }
        .classic-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        /* Style for standard input datalist */
        input::-webkit-calendar-picker-indicator {
            display: none !important;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4 sm:px-6 lg:px-8">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-10 border-b border-gray-300 pb-6">
            <h1 class="text-3xl sm:text-4xl font-semibold tracking-tight text-gray-900 mb-2">วิเคราะห์ดวงดาวจร (เฉพาะบุคคล)</h1>
            <p class="text-lg text-gray-600">คำทำนายอ้างอิงจากโครงสร้างดวงเดิม ลัคนากุมภ์ (กระจุกดาว ธนู-กุมภ์)</p>
        </header>

        <!-- Form Section -->
        <div class="bg-white rounded-lg classic-shadow p-6 sm:p-10 mb-8 border border-gray-200">
            <div class="flex items-center justify-between mb-6 border-b border-gray-200 pb-4">
                <h2 class="text-xl font-medium text-gray-800 border-l-4 border-gray-800 pl-3">เลือกตำแหน่งและสถานะดาวจร</h2>
                <span class="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-md hidden sm:inline-block">พิมพ์ชื่อราศีเพื่อค้นหา</span>
            </div>
            
            <form id="astroForm" class="space-y-6">
                <!-- Datalist for autocomplete suggestions -->
                <datalist id="signs-datalist"></datalist>

                <!-- Input grids will be generated here by JavaScript -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-x-8 gap-y-6" id="inputContainer"></div>

                <div class="pt-8 border-t border-gray-100 flex justify-center sm:justify-end gap-4 mt-8">
                    <button type="button" onclick="resetForm()" class="px-6 py-2.5 border border-gray-300 rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-colors">
                        ล้างข้อมูล
                    </button>
                    <button type="button" onclick="generatePrediction()" class="px-6 py-2.5 border border-transparent rounded-md text-white bg-gray-800 hover:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-800 transition-colors shadow-sm">
                        วิเคราะห์ผล
                    </button>
                </div>
            </form>
        </div>

        <!-- Result Section -->
        <div id="resultSection" class="hidden">
            <h2 class="text-2xl font-medium mb-6 text-gray-800 text-center">ผลการวิเคราะห์</h2>
            <div id="resultContent" class="space-y-6">
                <!-- Predictions will appear here -->
            </div>
        </div>
    </div>

        window.onload = function() {
            // 1. Populate standard datalist once
            const datalist = document.getElementById('signs-datalist');
            signs.forEach(sign => {
                const option = document.createElement('option');
                option.value = `${sign.name} (${sign.house})`;
                datalist.appendChild(option);
            });

            // 2. Generate form inputs and status tags
            const container = document.getElementById('inputContainer');
            
            planets.forEach(planet => {
                const wrapper = document.createElement('div');
                wrapper.className = 'flex flex-col bg-gray-50 p-4 rounded-md border border-gray-100';
                
                // Header (Planet Name + Tags)
                const headerDiv = document.createElement('div');
                headerDiv.className = 'flex items-center justify-between mb-3';
                
                const label = document.createElement('label');
                label.setAttribute('for', `input-sign-${planet.id}`);
                label.className = 'block text-sm font-semibold text-gray-800 border-l-2 border-gray-800 pl-2';
                label.textContent = `${planet.name} (${planet.num})`;

                const tagsDiv = document.createElement('div');
                tagsDiv.className = 'flex gap-1.5';
                
                const noteDiv = document.createElement('div');
                noteDiv.id = `note-${planet.id}`;
                noteDiv.className = 'hidden mb-3 text-xs p-2 rounded-md transition-all';
                noteDiv.dataset.currentStatus = 'normal';

                let allowedStatuses = [];
                if (['sun', 'rahu', 'ketu'].includes(planet.id)) {
                    // อาทิตย์ ราหู เกตุ ไม่มี Tag
                    allowedStatuses = [];
                } else if (planet.id === 'moon') {
                    // จันทร์ มีแค่ "ดับ"
                    allowedStatuses = ['combust'];
                } else if (planet.id === 'uranus') {
                    // มฤตยู ไม่มี "ดับ"
                    allowedStatuses = ['retrograde', 'stationary', 'fast'];
                } else {
                    // ดาวอื่นๆ (อังคาร พุธ พฤหัส ศุกร์ เสาร์) มีครบ
                    allowedStatuses = ['retrograde', 'stationary', 'fast', 'combust'];
                }

                // Create Status Tags dynamically based on the filtered list
                statuses.filter(s => allowedStatuses.includes(s.id)).forEach(status => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'px-2 py-0.5 text-xs rounded-full border border-gray-300 text-gray-500 bg-white hover:bg-gray-100 transition-colors focus:outline-none';
                    btn.textContent = status.name;
                    btn.dataset.statusId = status.id;
                    
                    btn.onclick = () => {
                        const isCurrentlyActive = noteDiv.dataset.currentStatus === status.id;
                        
                        // Reset all buttons in this group
                        const allBtns = tagsDiv.querySelectorAll('button');
                        allBtns.forEach(b => {
                            b.className = 'px-2 py-0.5 text-xs rounded-full border border-gray-300 text-gray-500 bg-white hover:bg-gray-100 transition-colors focus:outline-none';
                        });

                        if (isCurrentlyActive) {
                            // Turn off (revert to normal)
                            noteDiv.dataset.currentStatus = 'normal';
                            noteDiv.className = 'hidden';
                        } else {
                            // Turn on this status
                            btn.className = `px-2 py-0.5 text-xs rounded-full border border-transparent text-white bg-gray-700 shadow-sm focus:outline-none`;
                            noteDiv.dataset.currentStatus = status.id;
                            noteDiv.className = `mb-3 text-xs p-2.5 rounded-md border ${status.color} transition-all`;
                            noteDiv.textContent = status.desc;
                        }
                    };
                    tagsDiv.appendChild(btn);
                });

                headerDiv.appendChild(label);
                headerDiv.appendChild(tagsDiv);

                // Autocomplete Input
                const input = document.createElement('input');
                input.type = 'text';
                input.id = `input-sign-${planet.id}`;
                input.setAttribute('list', 'signs-datalist');
                input.placeholder = 'พิมพ์ชื่อราศี หรือคลิกเลือก...';
                input.className = 'block w-full rounded-md border border-gray-300 bg-white py-2 pl-3 pr-3 text-sm focus:border-gray-800 focus:outline-none focus:ring-1 focus:ring-gray-800 text-gray-700 classic-shadow transition-colors';
                
                // For easy clearing text on click (optional UX enhancement)
                input.onclick = function() { this.value = ''; }

                wrapper.appendChild(headerDiv);
                wrapper.appendChild(noteDiv);
                wrapper.appendChild(input);

                const dignityWrapper = document.createElement('div');
                dignityWrapper.className = 'mt-3 pt-3 border-t border-gray-100';
                
                const dignityLabel = document.createElement('div');
                dignityLabel.className = 'text-xs text-gray-500 mb-2 flex items-center justify-between font-medium';
                dignityLabel.innerHTML = `<span>⭐ มาตรฐาน/เกณฑ์ดาว (กดเลือกได้หลายอัน)</span>`;

                const dignityTagsDiv = document.createElement('div');
                dignityTagsDiv.id = `dignity-tags-${planet.id}`;
                dignityTagsDiv.className = 'flex overflow-x-auto gap-1.5 pb-2 hide-scrollbar';
                
                const dignityNoteDiv = document.createElement('div');
                dignityNoteDiv.id = `dignity-note-${planet.id}`;
                dignityNoteDiv.className = 'space-y-1.5 mt-1';

                // เก็บสถานะ Tag ที่ถูกเลือกเป็น Array
                dignityTagsDiv.dataset.selected = JSON.stringify([]);

                dignities.forEach(dig => {
                    const dBtn = document.createElement('button');
                    dBtn.type = 'button';
                    dBtn.className = 'shrink-0 px-2.5 py-1 text-[11px] rounded-full border border-gray-200 text-gray-600 bg-gray-50 hover:bg-gray-100 transition-colors focus:outline-none whitespace-nowrap';
                    dBtn.textContent = dig.name;
                    
                    dBtn.onclick = () => {
                        let selected = JSON.parse(dignityTagsDiv.dataset.selected);
                        const index = selected.indexOf(dig.id);
                        
                        // Toggle Logic
                        if (index > -1) {
                            selected.splice(index, 1);
                            dBtn.className = 'shrink-0 px-2.5 py-1 text-[11px] rounded-full border border-gray-200 text-gray-600 bg-gray-50 hover:bg-gray-100 transition-colors focus:outline-none whitespace-nowrap';
                        } else {
                            selected.push(dig.id);
                            dBtn.className = 'shrink-0 px-2.5 py-1 text-[11px] rounded-full border border-transparent text-white bg-gray-600 shadow-sm focus:outline-none whitespace-nowrap';
                        }
                        dignityTagsDiv.dataset.selected = JSON.stringify(selected);
                        
                        // Update Notes
                        dignityNoteDiv.innerHTML = '';
                        selected.forEach(selId => {
                            const sObj = dignities.find(d => d.id === selId);
                            const nDiv = document.createElement('div');
                            nDiv.className = `text-[11px] p-2 rounded border ${sObj.color}`;
                            nDiv.innerHTML = `<b>${sObj.name}:</b> ${sObj.desc}`;
                            dignityNoteDiv.appendChild(nDiv);
                        });
                    };
                    dignityTagsDiv.appendChild(dBtn);
                });

                dignityWrapper.appendChild(dignityLabel);
                dignityWrapper.appendChild(dignityTagsDiv);
                dignityWrapper.appendChild(dignityNoteDiv);

                wrapper.appendChild(dignityWrapper);
                
                container.appendChild(wrapper);
            });
        };

        function generatePrediction() {
            const resultSection = document.getElementById('resultSection');
            const resultContent = document.getElementById('resultContent');
            resultContent.innerHTML = '';
            
            let hasSelection = false;

            planets.forEach(planet => {
                const inputElement = document.getElementById(`input-sign-${planet.id}`);
                const inputValue = inputElement.value.trim();
                
                // Find matching sign logic (allows full text or just the name like "เมษ" or "ราศีเมษ")
                const signObj = signs.find(s => 
                    `${s.name} (${s.house})` === inputValue || 
                    s.name === inputValue || 
                    s.name.replace('ราศี', '') === inputValue
                );

                if (signObj) {
                    hasSelection = true;
                    let predictionText = astroData[planet.id][signObj.id];
                    
                    // Read active status from the note div's dataset
                    const noteDiv = document.getElementById(`note-${planet.id}`);
                    const activeStatusId = noteDiv.dataset.currentStatus;
                    
                    let smartNoteHtml = "";
                    if (activeStatusId !== 'normal') {
                        const statusObj = statuses.find(s => s.id === activeStatusId);
                        smartNoteHtml += `
                            <div class="mt-4 p-3 rounded border text-sm ${statusObj.color}">
                                <span class="font-semibold">📌 สถานะ ${statusObj.name}:</span> 
                                <span>${statusObj.desc.split(':')[1].trim()}</span>
                            </div>
                        `;
                    }
                    
                    const dTagsDiv = document.getElementById(`dignity-tags-${planet.id}`);
                    const selectedDignities = JSON.parse(dTagsDiv.dataset.selected || "[]");
                    
                    if (selectedDignities.length > 0) {
                        smartNoteHtml += `<div class="mt-3 space-y-2">`;
                        selectedDignities.forEach(digId => {
                            const dObj = dignities.find(d => d.id === digId);
                            smartNoteHtml += `
                                <div class="p-3 rounded border text-sm ${dObj.color}">
                                    <span class="font-semibold">✨ ${dObj.name}:</span> 
                                    <span>${dObj.desc}</span>
                                </div>
                            `;
                        });
                        smartNoteHtml += `</div>`;
                    }
                    
                    const isWarning = predictionText.includes("ระวังขั้นสุด") || predictionText.includes("โคตรอันตราย");
                    const cardClass = isWarning 
                        ? 'bg-red-50 border-l-4 border-red-800 p-5 rounded-r-lg classic-shadow border border-y-red-100 border-r-red-100' 
                        : 'bg-white border-l-4 border-gray-800 p-5 rounded-r-lg classic-shadow border border-y-gray-200 border-r-gray-200';
                    
                    const titleColor = isWarning ? 'text-red-900' : 'text-gray-900';

                    const card = document.createElement('div');
                    card.className = cardClass;
                    card.innerHTML = `
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-3 border-b border-gray-200 pb-3 gap-2">
                            <h3 class="text-lg font-semibold ${titleColor}">${planet.name} (${planet.num})</h3>
                            <span class="text-sm font-medium text-gray-500 bg-gray-100 px-3 py-1 rounded-full self-start sm:self-auto border border-gray-200">
                                จรไปที่ ${signObj.name} <span class="text-gray-400">|</span> ภพ${signObj.house}
                            </span>
                        </div>
                        <p class="text-gray-800 leading-relaxed">${predictionText}</p>
                        ${smartNoteHtml}
                    `;
                    resultContent.appendChild(card);
                }
            });

            if (!hasSelection) {
                resultContent.innerHTML = `
                    <div class="text-center p-8 bg-gray-50 rounded-lg border border-dashed border-gray-300">
                        <p class="text-gray-500">กรุณาพิมพ์หรือเลือกราศีอย่างน้อย 1 ดวง เพื่อดูคำทำนาย (เช่น พิมพ์ "เมษ" แล้วคลิกเลือก)</p>
                    </div>
                `;
            }

            resultSection.classList.remove('hidden');
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function resetForm() {
            planets.forEach(planet => {
                document.getElementById(`input-sign-${planet.id}`).value = '';
                
                // Reset tags and notes
                const noteDiv = document.getElementById(`note-${planet.id}`);
                noteDiv.dataset.currentStatus = 'normal';
                noteDiv.className = 'hidden';
                
                const tagsDiv = noteDiv.previousElementSibling;
                const allBtns = tagsDiv.querySelectorAll('button');
                allBtns.forEach(b => {
                    b.className = 'px-2 py-0.5 text-xs rounded-full border border-gray-300 text-gray-500 bg-white hover:bg-gray-100 transition-colors focus:outline-none';
                });

                const dTagsDiv = document.getElementById(`dignity-tags-${planet.id}`);
                if(dTagsDiv) {
                    dTagsDiv.dataset.selected = JSON.stringify([]);
                    const allDBtns = dTagsDiv.querySelectorAll('button');
                    allDBtns.forEach(b => {
                        b.className = 'shrink-0 px-2.5 py-1 text-[11px] rounded-full border border-gray-200 text-gray-600 bg-gray-50 hover:bg-gray-100 transition-colors focus:outline-none whitespace-nowrap';
                    });
                }
                const dNoteDiv = document.getElementById(`dignity-note-${planet.id}`);
                if(dNoteDiv) {
                    dNoteDiv.innerHTML = '';
                }
            });
            const resultSection = document.getElementById('resultSection');
            resultSection.classList.add('hidden');
            document.getElementById('resultContent').innerHTML = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
