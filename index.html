        // Initialize Form
        window.onload = function() {
            const container = document.getElementById('dropdownContainer');
            
            planets.forEach(planet => {
                const wrapper = document.createElement('div');
                wrapper.className = 'flex flex-col';
                
                const label = document.createElement('label');
                label.setAttribute('for', `select-${planet.id}`);
                label.className = 'block text-sm font-medium text-gray-700 mb-2';
                label.textContent = `${planet.name} (${planet.num})`;
                
                const select = document.createElement('select');
                select.id = `select-${planet.id}`;
                select.className = 'block w-full rounded-md border border-gray-300 bg-white py-2.5 pl-3 pr-10 text-base focus:border-gray-800 focus:outline-none focus:ring-1 focus:ring-gray-800 sm:text-sm text-gray-700 classic-shadow transition-colors duration-200';
                
                const defaultOption = document.createElement('option');
                defaultOption.value = '';
                defaultOption.textContent = 'เลือกตำแหน่งดาวจร...';
                select.appendChild(defaultOption);
                
                signs.forEach(sign => {
                    const option = document.createElement('option');
                    option.value = sign.id;
                    option.textContent = `${sign.name} (${sign.house})`;
                    select.appendChild(option);
                });
                
                wrapper.appendChild(label);
                wrapper.appendChild(select);
                container.appendChild(wrapper);
            });
        };

        // Logic Functions
        function generatePrediction() {
            const resultSection = document.getElementById('resultSection');
            const resultContent = document.getElementById('resultContent');
            resultContent.innerHTML = '';
            
            let hasSelection = false;

            planets.forEach(planet => {
                const selectElement = document.getElementById(`select-${planet.id}`);
                const selectedValue = selectElement.value;

                if (selectedValue) {
                    hasSelection = true;
                    const signObj = signs.find(s => s.id === selectedValue);
                    const predictionText = astroData[planet.id][selectedValue];
                    
                    const isWarning = predictionText.includes("ระวังขั้นสุด") || predictionText.includes("โคตรอันตราย");
                    const cardClass = isWarning 
                        ? 'bg-red-50 border-l-4 border-red-800 p-5 rounded-r-lg classic-shadow border border-y-red-100 border-r-red-100' 
                        : 'bg-white border-l-4 border-gray-800 p-5 rounded-r-lg classic-shadow border border-y-gray-200 border-r-gray-200';
                    
                    const titleColor = isWarning ? 'text-red-900' : 'text-gray-900';

                    const card = document.createElement('div');
                    card.className = cardClass;
                    card.innerHTML = `
                        <div class="flex items-center justify-between mb-3 border-b border-gray-200 pb-2">
                            <h3 class="text-lg font-semibold ${titleColor}">${planet.name} (${planet.num})</h3>
                            <span class="text-sm font-medium text-gray-500 bg-gray-100 px-3 py-1 rounded-full">
                                จรไปที่ ${signObj.name} <span class="text-gray-400">|</span> ภพ${signObj.house}
                            </span>
                        </div>
                        <p class="text-gray-700 leading-relaxed">${predictionText}</p>
                    `;
                    resultContent.appendChild(card);
                }
            });

            if (!hasSelection) {
                resultContent.innerHTML = `
                    <div class="text-center p-8 bg-gray-50 rounded-lg border border-dashed border-gray-300">
                        <p class="text-gray-500">กรุณาเลือกตำแหน่งดาวจรอย่างน้อย 1 ดวง เพื่อดูคำทำนาย</p>
                    </div>
                `;
            }

            resultSection.classList.remove('hidden');
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function resetForm() {
            planets.forEach(planet => {
                document.getElementById(`select-${planet.id}`).value = '';
            });
            const resultSection = document.getElementById('resultSection');
            resultSection.classList.add('hidden');
            document.getElementById('resultContent').innerHTML = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
